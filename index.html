<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lesson Player</title>
  <meta name="description" content="Paste a YouTube link and watch it in a clean, distraction-free lesson player." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">▶</span>
      <span>Lesson Player</span>
    </div>
  </header>

  <main class="layout">
    <form id="link-form" class="link-form" autocomplete="off">
      <label for="link-input" class="sr-only">YouTube link</label>
      <input
        id="link-input"
        type="text"
        inputmode="url"
        placeholder="Paste a YouTube link, e.g. https://youtu.be/…"
        spellcheck="false"
      />
      <button type="submit">Play</button>
    </form>
    <p id="form-error" class="form-error" role="alert" hidden></p>

    <section id="stage" class="stage" hidden>
      <div id="player-shell" class="player-shell" tabindex="0" aria-label="Video player">
        <div class="video-frame">
          <div id="yt-target"></div>
        </div>

        <!-- Sits on top of the iframe so clicks go to our player, not YouTube's UI -->
        <div id="click-layer" class="click-layer"></div>

        <div id="poster" class="poster">
          <img id="poster-img" alt="" />
          <button id="big-play" class="big-play" aria-label="Play">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          </button>
        </div>

        <div id="spinner" class="spinner" hidden></div>

        <div id="player-error" class="player-error" hidden>
          <p id="player-error-text"></p>
        </div>

        <div id="controls" class="controls">
          <div class="seek-wrap">
            <div class="seek-track">
              <div id="seek-buffer" class="seek-buffer"></div>
              <div id="seek-progress" class="seek-progress"></div>
            </div>
            <input id="seek" class="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek" />
          </div>

          <div class="control-row">
            <button id="btn-play" class="ctl" aria-label="Play (k)">
              <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
            </button>
            <button id="btn-back" class="ctl" aria-label="Back 10 seconds (j)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/><text x="12" y="16.5" text-anchor="middle" font-size="7" font-weight="700">10</text></svg>
            </button>
            <button id="btn-fwd" class="ctl" aria-label="Forward 10 seconds (l)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z"/><text x="12" y="16.5" text-anchor="middle" font-size="7" font-weight="700">10</text></svg>
            </button>

            <div class="volume">
              <button id="btn-mute" class="ctl" aria-label="Mute (m)">
                <svg class="i-vol" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
                <svg class="i-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9H4zm15.6 3 2.1-2.1-1.4-1.4-2.1 2.1-2.1-2.1-1.4 1.4 2.1 2.1-2.1 2.1 1.4 1.4 2.1-2.1 2.1 2.1 1.4-1.4z"/></svg>
              </button>
              <input id="volume" class="volume-slider" type="range" min="0" max="100" value="100" aria-label="Volume" />
            </div>

            <span id="time" class="time">0:00 / 0:00</span>

            <span class="spacer"></span>

            <label class="speed">
              <span class="sr-only">Playback speed</span>
              <select id="speed" aria-label="Playback speed">
                <option value="0.5">0.5×</option>
                <option value="0.75">0.75×</option>
                <option value="1" selected>1×</option>
                <option value="1.25">1.25×</option>
                <option value="1.5">1.5×</option>
                <option value="1.75">1.75×</option>
                <option value="2">2×</option>
              </select>
            </label>

            <button id="btn-full" class="ctl" aria-label="Fullscreen (f)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="meta">
        <h1 id="video-title" class="video-title">Loading…</h1>
        <p id="video-author" class="video-author"></p>
        <p class="shortcuts">
          Shortcuts: <kbd>Space</kbd>/<kbd>K</kbd> play/pause ·
          <kbd>J</kbd>/<kbd>L</kbd> ±10s · <kbd>←</kbd>/<kbd>→</kbd> ±5s ·
          <kbd>M</kbd> mute · <kbd>F</kbd> fullscreen
        </p>
      </div>
    </section>

    <section id="empty" class="empty">
      <h2>Paste a link to start a lesson</h2>
      <p>Works with <code>youtube.com/watch?v=…</code>, <code>youtu.be/…</code>, Shorts, and embed links.</p>
    </section>

    <section id="recent-wrap" class="recent-wrap" hidden>
      <h2>Recently watched</h2>
      <ul id="recent" class="recent"></ul>
    </section>
  </main>

  <script src="parse.js"></script>
  <script src="yt.js"></script>
  <script src="app.js"></script>
</body>
</html>
